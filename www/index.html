<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ChipAI · Edge AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #0b1416;
      color: #e4f2f1;
      min-height: 100vh;
      padding: 16px;
    }
    main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; color: #5eead4; }
    .pill { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #13272a; border: 1px solid #244b50; }
    .pill.on { border-color: #2dd4bf; color: #5eead4; }
    .card { background: #112024; border: 1px solid #1e3a40; border-radius: 12px; padding: 14px; }
    .card h2 { font-size: 13px; color: #94b8b5; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { background: #0c171a; border-radius: 8px; padding: 8px; text-align: center; }
    .metric span { display: block; font-size: 11px; color: #7ca29f; }
    .metric strong { font-size: 16px; color: #f0fdfa; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button {
      flex: 1;
      min-width: 88px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #28565c;
      background: #163338;
      color: #e4f2f1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #1b7f79; border-color: #2dd4bf; color: #ffffff; }
    #log { font-family: ui-monospace, monospace; font-size: 11px; color: #9ec5c1; max-height: 120px; overflow-y: auto; line-height: 1.5; }
    @media (max-width: 280px), (max-height: 300px) {
      body { padding: 6px; }
      main { gap: 6px; }
      h1 { font-size: 14px; }
      .card { padding: 8px; border-radius: 8px; }
      .metrics { grid-template-columns: repeat(2, 1fr); gap: 4px; }
      .metric strong { font-size: 13px; }
      button { padding: 5px 6px; font-size: 11px; min-width: 60px; }
      #log { max-height: 60px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ChipAI 边缘推理控台</h1>
      <span class="pill" id="bleState">BLE 未连接</span>
    </header>

    <section class="card">
      <h2>BLE GATT · ESP32 / nRF52</h2>
      <div class="metrics">
        <div class="metric"><span>分类结果</span><strong id="topLabel">idle</strong></div>
        <div class="metric"><span>置信度</span><strong id="topScore">—</strong></div>
        <div class="metric"><span>阈值</span><strong id="thresholdVal">0.65</strong></div>
      </div>
      <div class="row">
        <button class="primary" id="connectBtn">连接芯片</button>
        <button id="startBtn">开启推理</button>
        <button id="stopBtn">停止推理</button>
        <button id="pingBtn">状态/心跳</button>
      </div>
    </section>

    <section class="card">
      <h2>穿戴手势 · 戒指 / 手杖</h2>
      <p style="font-size:12px;color:#94b8b5">💍 倾斜调阈值 · 摇晃启停推理 ｜ 🦯 轻点请求状态 · 摆动切换模式</p>
      <div class="row">
        <button id="wearable-enable">启用戒指/手杖传感</button>
        <button id="simBtn">本地模拟一帧</button>
      </div>
    </section>

    <section class="card">
      <h2>协议帧日志 (SOF 'CA' + CRC8)</h2>
      <div id="log">就绪：等待连接 ChipAI-* 外设或运行本地模拟…</div>
    </section>
  </main>

  <script type="module">
    import {
      CAI_UUIDS,
      CAI_CMD,
      CAI_EVT,
      encodeFrame,
      decodeFrame,
      buildSetThresholdFrame,
      parseStatusPayload,
      parseResultPayload,
    } from './protocol.js';
    import { createWearableInput } from './wearable-input.js';

    const LABELS = ['idle', 'walk', 'run'];
    let threshold = 0.65;
    let inferRunning = false;
    let controlChar = null;

    const $ = (id) => document.getElementById(id);
    function appendLog(msg) {
      const el = $('log');
      el.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + el.textContent.slice(0, 600);
    }

    async function sendFrame(frame, label) {
      const hex = [...frame].map((b) => b.toString(16).padStart(2, '0')).join(' ');
      appendLog(`TX [${label}] ${hex}`);
      if (controlChar) {
        await controlChar.writeValueWithoutResponse(frame);
      }
    }

    function handleIncoming(bytes) {
      const frame = decodeFrame(bytes);
      if (!frame) return appendLog('RX CRC/SOF 校验失败');
      if (frame.cmd === CAI_EVT.STATUS) {
        const st = parseStatusPayload(frame.payload);
        if (st) {
          inferRunning = st.inferEnabled;
          threshold = st.threshold;
          $('thresholdVal').textContent = threshold.toFixed(2);
          appendLog(`RX STATUS batt=${st.batteryPct}% infer=${st.inferEnabled}`);
        }
      } else if (frame.cmd === CAI_EVT.RESULT) {
        const res = parseResultPayload(frame.payload);
        if (res) {
          $('topLabel').textContent = LABELS[res.topIndex] || `#${res.topIndex}`;
          $('topScore').textContent = `${res.topScore.toFixed(3)} (${res.inferUs}µs)`;
        }
      } else if (frame.cmd === CAI_EVT.PONG) {
        appendLog('RX PONG');
      }
    }

    $('connectBtn').addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        appendLog('当前环境不支持 Web Bluetooth，已切换本地协议回环');
        return;
      }
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: CAI_UUIDS.broadcastPrefix }],
          optionalServices: [CAI_UUIDS.service],
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(CAI_UUIDS.service);
        controlChar = await service.getCharacteristic(CAI_UUIDS.control);
        const statusChar = await service.getCharacteristic(CAI_UUIDS.status);
        const resultChar = await service.getCharacteristic(CAI_UUIDS.result);
        await statusChar.startNotifications();
        statusChar.addEventListener('characteristicvaluechanged', (e) =>
          handleIncoming(new Uint8Array(e.target.value.buffer))
        );
        await resultChar.startNotifications();
        resultChar.addEventListener('characteristicvaluechanged', (e) =>
          handleIncoming(new Uint8Array(e.target.value.buffer))
        );
        $('bleState').textContent = `已连接 ${device.name || 'ChipAI'}`;
        $('bleState').classList.add('on');
        await sendFrame(encodeFrame(CAI_CMD.REQUEST_STATUS), 'STATUS');
      } catch (err) {
        appendLog(`连接取消/失败: ${err.message}`);
      }
    });

    $('startBtn').addEventListener('click', () => {
      inferRunning = true;
      sendFrame(encodeFrame(CAI_CMD.START_INFER), 'START');
    });
    $('stopBtn').addEventListener('click', () => {
      inferRunning = false;
      sendFrame(encodeFrame(CAI_CMD.STOP_INFER), 'STOP');
    });
    $('pingBtn').addEventListener('click', () => sendFrame(encodeFrame(CAI_CMD.PING), 'PING'));

    $('simBtn').addEventListener('click', () => {
      const buf = new ArrayBuffer(8);
      const dv = new DataView(buf);
      dv.setUint8(0, 1);
      dv.setUint8(1, 3);
      dv.setUint16(2, 420, true);
      dv.setFloat32(4, 0.918, true);
      handleIncoming(encodeFrame(CAI_EVT.RESULT, new Uint8Array(buf)));
    });

    const wearable = createWearableInput({
      onRingShake: () => {
        inferRunning = !inferRunning;
        sendFrame(encodeFrame(inferRunning ? CAI_CMD.START_INFER : CAI_CMD.STOP_INFER), 'RING_TOGGLE');
      },
      onRingTiltUp: () => {
        threshold = Math.min(0.95, +(threshold + 0.05).toFixed(2));
        $('thresholdVal').textContent = threshold.toFixed(2);
        sendFrame(buildSetThresholdFrame(threshold), 'THRESHOLD+');
      },
      onRingTiltDown: () => {
        threshold = Math.max(0.1, +(threshold - 0.05).toFixed(2));
        $('thresholdVal').textContent = threshold.toFixed(2);
        sendFrame(buildSetThresholdFrame(threshold), 'THRESHOLD-');
      },
      onCaneTap: () => sendFrame(encodeFrame(CAI_CMD.REQUEST_STATUS), 'CANE_STATUS'),
      onCaneSwing: (dir) =>
        sendFrame(encodeFrame(dir === 'right' ? CAI_CMD.START_INFER : CAI_CMD.STOP_INFER), `CANE_${dir.toUpperCase()}`),
    });

    $('wearable-enable').addEventListener('click', async (ev) => {
      const ok = await wearable.requestPermission();
      if (ok) {
        wearable.start();
        ev.target.textContent = '戒指/手杖传感已开启';
        appendLog('DeviceOrientationEvent / DeviceMotionEvent 穿戴输入已就绪');
      }
    });
  </script>
</body>
</html>
